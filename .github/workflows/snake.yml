name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tturwcode
          outputs: |
            dist/github-snake.svg?color_snake=%23d946ef&color_dots=%23161b22,%2321262d,%23238636,%232ea043,%2339d353
            dist/github-snake-dark.svg?color_snake=%23d946ef&color_dots=%23161b22,%2321262d,%23238636,%232ea043,%2339d353

      - name: Push snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
